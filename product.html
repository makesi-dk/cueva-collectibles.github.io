<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — CUEVA Collectibles</title><link rel="stylesheet" href="styles.css"></head><body><header class="simple-head"><a href="index.html"><img src="assets/images/brand/cueva-logo.jpg" alt="CUEVA"></a><a class="back" href="shop.html">← Continue Shopping</a></header><main class="product-page" id="productView"></main><footer><div class="foot-brand"><img src="assets/images/brand/cueva-logo.jpg" alt="CUEVA"><p>Collect. Play. Display.</p></div><div><h4>Support</h4><p>support@cuevacollectibles.com</p><p>+1 (888) 555-0123</p></div></footer><div class="copyright">© 2026 CUEVA Collectibles. All rights reserved.</div><div id="toast" class="toast"></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=Number(new URLSearchParams(location.search).get('id')||1),p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+' — CUEVA';document.getElementById('productView').innerHTML=`<div class="product-media"><img src="${p.image}" alt="${p.name}"></div><div class="product-info"><span class="eyebrow dark">${p.category}</span><h1>${p.name}</h1><div class="rating">${stars(p.rating)} <b>${p.rating}</b> · ${p.reviews} reviews</div><div class="bigprice">${money(p.price)}</div><p>Carefully selected for the CUEVA catalog. Product imagery and presentation are designed to help collectors understand the item at a glance.</p><ul class="checks"><li>Collector-focused presentation</li><li>Secure packaging</li><li>Fast U.S. shipping options</li><li>30-day return policy</li></ul><button class="primary" onclick="addCart(${p.id})">Add to Cart — ${money(p.price)}</button><a class="supportlink" href="support.html">Need help? Contact CUEVA Support →</a></div>`})</script></body></html>
